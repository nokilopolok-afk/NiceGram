name: Build NiceGram Next

on:
  push:
    branches: [main, master, rewrite]
    paths:
      - "NiceGramNext/**"
      - ".github/workflows/build-nicegram-next.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission
        run: chmod +x NiceGramNext/gradlew

      - name: Build debug APK
        run: ./NiceGramNext/gradlew -p NiceGramNext assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NiceGramNext-debug-apk
          path: NiceGramNext/app/build/outputs/apk/debug/*.apk
