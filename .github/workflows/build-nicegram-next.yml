name: Build NiceGram Next

on:
  push:
    branches: [main, master, rewrite]
    paths:
      - "NiceGramNext/**"
      - ".github/workflows/build-nicegram-next.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NICEGRAM_API_ID: ${{ secrets.NICEGRAM_API_ID }}
      NICEGRAM_API_HASH: ${{ secrets.NICEGRAM_API_HASH }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Grant execute permission
        run: chmod +x NiceGramNext/gradlew

      - name: Test and build debug APK
        run: ./NiceGramNext/gradlew -p NiceGramNext testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NiceGramNext-debug-apk
          path: NiceGramNext/app/build/outputs/apk/debug/*.apk
