name: Build NiceGram APK and AAB

on:
  push:
    branches: [main, master, rewrite]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NICEGRAM_API_ID: ${{ secrets.NICEGRAM_API_ID }}
      NICEGRAM_API_HASH: ${{ secrets.NICEGRAM_API_HASH }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$NICEGRAM_API_ID"
          test -n "$NICEGRAM_API_HASH"
          test -n "${{ secrets.SIGNING_STORE_BASE64 }}"
          test -n "${{ secrets.SIGNING_STORE_PASSWORD }}"
          test -n "${{ secrets.SIGNING_KEY_ALIAS }}"
          test -n "${{ secrets.SIGNING_KEY_PASSWORD }}"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare secrets
        shell: bash
        run: |
          echo "${{ secrets.SIGNING_STORE_BASE64 }}" | base64 --decode > TMessagesProj/config/nicegram.jks
          cat > API_KEYS <<EOF
          APP_ID = $NICEGRAM_API_ID
          APP_HASH = "$NICEGRAM_API_HASH"
          MAPS_V2_API = ${{ secrets.MAPS_V2_API }}
          SIGNING_KEY_STORE_PASSWORD = ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS = ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD = ${{ secrets.SIGNING_KEY_PASSWORD }}
          EOF
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > TMessagesProj/google-services.json
          fi

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleAfatRelease

      - name: Build AAB
        run: ./gradlew bundleAfatRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NiceGram-apk
          path: TMessagesProj/build/outputs/apk/afat/release/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: NiceGram-aab
          path: TMessagesProj/build/outputs/bundle/afatRelease/*.aab
